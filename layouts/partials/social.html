{{- if .Site.Params.minima.social_links -}}
<ul class="social-media-list">
  {{- range .Site.Params.minima.social_links -}}
  <li>
    <a rel="me" href="{{ .user_url }}" target="_blank" title="{{ .title | default .platform }}">
      <svg class="svg-icon grey">
        <use xlink:href="{{ "/assets/minima-social-icons.svg" | relURL }}#{{ .platform }}"></use>
      </svg>
    </a>
  </li>
  {{- end -}}
</ul>
{{- end -}}
